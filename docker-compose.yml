version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=urlshield-compose-secret-key-prod
      - DATABASE_URL=postgresql://urlshield_user:urlshield_pass@db:5432/urlshield_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=urlshield_user
      - POSTGRES_PASSWORD=urlshield_pass
      - POSTGRES_DB=urlshield_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshield_user -d urlshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
